name : Validate files
on: push
jobs: 
    validate-file:
        runs-on: ubantu-latest

        steps:
            - name: get-repo-code 
              uses: actions/checkout@v4
              
            - name: validate html file
              run: test -f index.html
              
            - name: validate js file
              run:  test -f script.js 

            